<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Mastery Hub</title>
    <link rel="stylesheet" href="language_hub.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <aside class="sidebar">
        <button class="flag-btn active" data-lang="english" title="English (UK)">
            <img src="https://flagcdn.com/w80/gb.png" width="30" style="border-radius: 2px;">
        </button>
        <button class="flag-btn" data-lang="chinese" title="Chinese (China)">
            <img src="https://flagcdn.com/w80/cn.png" width="30" style="border-radius: 2px;">
        </button>
        <button class="flag-btn" data-lang="philippine" title="Philippine">
            <img src="https://flagcdn.com/w80/ph.png" width="30" style="border-radius: 2px;">
        </button>
        <button class="flag-btn" data-lang="korean" title="Korean">
            <img src="https://flagcdn.com/w80/kr.png" width="30" style="border-radius: 2px;">
        </button>

        <div class="thesis-timer" title="Days until Thesis Submission">
            <span class="days-count" id="days-count">0</span>
            DAYS
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="lang-title" id="lang-title">🇬🇧 English Mastery</h1>
            <p style="color: var(--text-secondary);">Your 12-week roadmap to fluency.</p>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            <div class="search-container">
                <input type="text" id="youtube-search" placeholder="Search YouTube for lessons..." class="search-input">
                <button id="search-btn" class="search-btn" title="Search YouTube">
                    <!-- YouTube Logo -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#FF0000" xmlns="http://www.w3.org/2000/svg"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.016 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </button>
                <a href="https://chat.deepseek.com" target="_blank" class="ai-btn deepseek" title="Open DeepSeek AI">
                    <!-- DeepSeek Logo -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>
                    <span>DeepSeek</span>
                </a>
                <a href="https://chat.openai.com" target="_blank" class="ai-btn chatgpt" title="Open ChatGPT AI">
                    <!-- ChatGPT Logo -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg"><path d="M22.28 9.82a5.98 5.98 0 0 0-.52-4.91 6.05 6.05 0 0 0-4-2.83 6.03 6.03 0 0 0-5.06.98 6.04 6.04 0 0 0-4.56-2.11 6.06 6.06 0 0 0-5.18 3.05 6.03 6.03 0 0 0-1.14 4.88 6.04 6.04 0 0 0 .51 4.91 6.02 6.02 0 0 0 4.01 2.82 6.01 6.01 0 0 0 5.06-.99 6.06 6.06 0 0 0 4.56 2.11 6.06 6.06 0 0 0 5.18-3.05 6.03 6.03 0 0 0 1.13-4.88zM12 13.11l-3.37 1.91a.89.89 0 0 0-.44.77v3.95l-.11-.06a4.41 4.41 0 0 1-1.5-2.63 4.36 4.36 0 0 1 1.21-2.87l.11-.06 3.37-1.91a.88.88 0 0 0 .44-.77v-4.76l1.69.98a.07.07 0 0 1 .03.05v3.95a4.45 4.45 0 0 1-1.49 2.63z"/></svg>
                    <span>ChatGPT</span>
                </a>
                <a href="https://gemini.google.com" target="_blank" class="ai-btn gemini" title="Open Gemini AI">
                    <!-- Gemini Logo -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2z"/></svg>
                    <span>Gemini</span>
                </a>
                <a href="https://notebooklm.google.com" target="_blank" class="ai-btn notebook" title="Open NotebookLM Research">
                    <!-- NotebookLM Logo -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg"><path d="M4 4v16h16V4H4zm14 14H6V6h12v12zM8 8h8v2H8V8zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
                    <span>NotebookLM</span>
                </a>
            </div>
        </header>

        <section id="roadmap-grid" class="roadmap-grid">
            <!-- Roadmap cards will be injected here by JS -->
        </section>

        <section class="resources-section">
            <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Free Online Resources</h2>
            <div id="resource-list" class="resource-list">
                <!-- Resources will be injected here by JS -->
            </div>
        </section>

        <section class="notes-section">
            <h2 style="font-size: 1.5rem;">Daily Study Notes</h2>
            <textarea id="daily-notes" class="notes-area" placeholder="Write your thoughts, vocabulary, or research ideas here..."></textarea>
        </section>
    </main>

    <script src="language_hub_data.js"></script>
    <script src="language_hub.js"></script>
</body>
</html>
